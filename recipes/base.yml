---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: fabrial-os
description: Personal Aurora (KDE) desktop image (basic)

base-image: ghcr.io/ublue-os/aurora
image-version: stable

modules:

  # ── 1. SYSTEM FILES ────────────────────────────────────────────────────────
  - from-file: base/files.yml
  - from-file: base/groups.yml

  # ── 2. RPM PACKAGES ────────────────────────────────────────────────────────
  - from-file: base/packages.yml

  # ── 3. BREW PACKAGES ───────────────────────────────────────────────────────
  - from-file: base/brew.yml

  # ── 4. SYSTEMD SERVICES ────────────────────────────────────────────────────
  - from-file: base/services.yml

  # ── 5. JUSTFILES ───────────────────────────────────────────────────────────
  - from-file: base/justfiles.yml
  - type: justfiles
    include:
      - 60-base.just

  # ── 6. CHEZMOI ─────────────────────────────────────────────────────────────
  - from-file: base/chezmoi.yml

  # ── 7. FLATPAKS ────────────────────────────────────────────────────────────
  - from-file: system-flatpaks.yml
  - from-file: media-flatpaks.yml
  - from-file: base/flatpaks.yml

  # ── 8. SIGNING ─────────────────────────────────────────────────────────────
  - type: signing
